name: Apply Director Password Recovery

on:
  push:
    branches:
      - fix/director-password-recovery

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[password-recovery-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/director-password-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply password recovery changes
        run: node scripts/apply-password-recovery.mjs

      - name: Remove one-time updater and commit result
        run: |
          rm -f scripts/apply-password-recovery.mjs .github/workflows/zz-apply-password-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Director password recovery [password-recovery-applied]" || exit 0
          git push origin HEAD:fix/director-password-recovery
