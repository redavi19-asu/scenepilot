name: Verify Apple billing credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check existing dedicated purchase key against Apple
        env:
          BILLING_ISSUER: ${{ secrets.APP_STORE_ISSUER_ID }}
          BILLING_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          BILLING_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {createPrivateKey,sign} from 'node:crypto';
          const env=process.env,encode=value=>Buffer.from(JSON.stringify(value)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const head=encode({alg:'ES256',kid:env.BILLING_KEY_ID.trim(),typ:'JWT'});
          const body=encode({iss:env.BILLING_ISSUER.trim(),iat:now,exp:now+300,aud:'appstoreconnect-v1',bid:'com.icomputeranything.scenepilot'});
          const input=head+'.'+body;
          const privateKey=createPrivateKey(env.BILLING_KEY.replace(/\\n/g,'\n').trim());
          const jwt=input+'.'+sign('sha256',Buffer.from(input),{key:privateKey,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const result={matchesDedicatedPurchaseKey:env.BILLING_KEY_ID.trim()==='HDQPZ8RZVM',matchesTeamIssuer:env.BILLING_ISSUER.trim()==='cee45b19-1d13-495a-ae66-299e51175bd0'};
          for(const [name,host] of [['production','api.storekit.apple.com'],['sandbox','api.storekit-sandbox.apple.com']]){
            const response=await fetch(`https://${host}/inApps/v1/transactions/1234567890`,{headers:{Authorization:'Bearer '+jwt,Accept:'application/json'},signal:AbortSignal.timeout(30000)});
            result[name]={httpStatus:response.status};
          }
          console.log(JSON.stringify(result));
          if(!result.matchesDedicatedPurchaseKey||!result.matchesTeamIssuer||Object.values(result).some(v=>v?.httpStatus===401))process.exitCode=1;
          JS
