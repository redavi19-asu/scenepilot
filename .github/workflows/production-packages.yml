name: Urban Director Studio Production Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/production-packages.yml']

permissions:
  contents: write

concurrency:
  group: urban-director-production-packages
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      windows_ready: ${{ steps.check.outputs.windows_ready }}
      apple_ready: ${{ steps.check.outputs.apple_ready }}
      android_ready: ${{ steps.check.outputs.android_ready }}
    steps:
      - id: check
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ] && echo "windows_ready=true" >> "$GITHUB_OUTPUT" || echo "windows_ready=false" >> "$GITHUB_OUTPUT"
          [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ] && echo "apple_ready=true" >> "$GITHUB_OUTPUT" || echo "apple_ready=false" >> "$GITHUB_OUTPUT"
          [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] && echo "android_ready=true" >> "$GITHUB_OUTPUT" || echo "android_ready=false" >> "$GITHUB_OUTPUT"

  windows:
    needs: preflight
    if: needs.preflight.outputs.windows_ready == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Build signed Windows installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          npm ci
          npm run build
          npm run package:win
      - name: Verify and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release -File -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer produced." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Windows signature is not valid: $($signature.Status)" }
          Copy-Item $installer.FullName "Urban-Director-Studio-Windows-x64.exe"
          gh release view director-production --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create director-production --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Urban Director Studio Production Apps" --notes "Verified signed production packages." }
          gh release upload director-production "Urban-Director-Studio-Windows-x64.exe" --repo "$env:GITHUB_REPOSITORY" --clobber

  macos:
    needs: preflight
    if: needs.preflight.outputs.apple_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            asset: Urban-Director-Studio-macOS-Apple-Silicon.dmg
          - arch: x64
            asset: Urban-Director-Studio-macOS-Intel.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Build signed Mac DMG
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          npm ci
          npm run build
          npx electron-builder --mac dmg --${{ matrix.arch }}
      - name: Notarize, staple and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          DMG="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          cp "$DMG" "$ASSET"
          gh release view director-production --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create director-production --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Urban Director Studio Production Apps" --notes "Verified signed production packages."
          gh release upload director-production "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    needs: preflight
    if: needs.preflight.outputs.android_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/director-release.jks"
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/director-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Verify and publish Android APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" Urban-Director-Studio-Android.apk
          gh release view director-production --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create director-production --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Urban Director Studio Production Apps" --notes "Verified signed production packages."
          gh release upload director-production Urban-Director-Studio-Android.apk --repo "$GITHUB_REPOSITORY" --clobber

  report-signing-gaps:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Report unavailable production signatures
        run: |
          [ "${{ needs.preflight.outputs.windows_ready }}" = "true" ] || echo "::warning::Windows signing certificate/password are missing."
          [ "${{ needs.preflight.outputs.apple_ready }}" = "true" ] || echo "::warning::Mac signing/notarization credentials are missing."
          [ "${{ needs.preflight.outputs.android_ready }}" = "true" ] || echo "::warning::Android signing credentials are missing."

  activate-downloads:
    needs: [windows, macos, android]
    if: always() && (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Activate only verified release URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/director-production"
          if [ "${{ needs.windows.result }}" = "success" ]; then printf '%s' "$BASE/Urban-Director-Studio-Windows-x64.exe" | npx --yes wrangler@latest secret put DIRECTOR_WINDOWS_DOWNLOAD_URL --name scenepilot; fi
          if [ "${{ needs.macos.result }}" = "success" ]; then
            printf '%s' "$BASE/Urban-Director-Studio-macOS-Apple-Silicon.dmg" | npx --yes wrangler@latest secret put DIRECTOR_MAC_ARM_DOWNLOAD_URL --name scenepilot
            printf '%s' "$BASE/Urban-Director-Studio-macOS-Intel.dmg" | npx --yes wrangler@latest secret put DIRECTOR_MAC_INTEL_DOWNLOAD_URL --name scenepilot
          fi
          if [ "${{ needs.android.result }}" = "success" ]; then printf '%s' "$BASE/Urban-Director-Studio-Android.apk" | npx --yes wrangler@latest secret put DIRECTOR_ANDROID_DOWNLOAD_URL --name scenepilot; fi
