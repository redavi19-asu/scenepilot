name: Manage Urban Director App Store Screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-store-screenshots.yml'
permissions:
  contents: read
concurrency:
  group: urban-director-app-store-screenshots
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Upload and verify Apple screenshots (no review submission)
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: node scripts/manage-app-store-screenshots.mjs --upload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-screenshot-verification
          path: apple-screenshot-*.json
