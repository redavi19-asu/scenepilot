name: Urban Director Studio CI + Cloudflare Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Urban Director Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Validate tenant and release invariants
        run: npm run validate:release

      - name: Build
        run: npm run build

      - name: Validate bundled iOS assets
        run: npx cap copy ios

      - name: Validate iOS privacy manifest
        run: |
          test -f ios/App/App/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyTracking" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyCollectedDataTypeEmailAddress" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyCollectedDataTypePhotosorVideos" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyCollectedDataTypeAudioData" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "PrivacyInfo.xcprivacy in Resources" ios/App/App.xcodeproj/project.pbxproj

  deploy:
    name: Deploy Urban Director Studio to Cloudflare
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply and verify D1 migrations through Worker binding
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            response="$(curl --silent --show-error https://scenepilot.ryanedavis.workers.dev/health || true)"

            if [ -n "$response" ]; then
              echo "$response"

              if HEALTH_JSON="$response" node -e '
                const data = JSON.parse(process.env.HEALTH_JSON || "{}");
                if (!data.databaseBound || !data.databaseReady) process.exit(1);
                if (Number(data.migrationCount || 0) < 9) process.exit(1);
              '; then
                echo "Urban Director Studio D1 migrations: PASS"
                exit 0
              fi
            fi

            echo "Waiting for the deployed Worker/D1 schema to become ready (attempt $attempt/5)..."
            sleep 2
          done

          echo "::error::Urban Director Studio D1 migrations did not reach the expected release schema."
          exit 1
