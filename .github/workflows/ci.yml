name: Urban Director Studio CI + Cloudflare Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Urban Director Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install encoder integration test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test Apple signing, video export and Stripe billing
        run: node --test worker/test/*.test.js src/nativeBackend.test.js src/desktopAuthReturn.test.js src/appleTransactionDelivery.test.js src/movieExport.test.js src/programAudioMixer.test.js src/soundboardStorage.test.js src/soundboardMicrophone.test.js src/popoutWorkspace.test.js src/aiTemplateArtwork.test.js src/templateReferences.test.js src/screenCapture.test.js src/ingestConnection.test.js electron/test/*.test.cjs server/test/*.test.mjs scripts/verify-testflight-build.test.mjs

      - name: Lint
        run: npm run lint

      - name: Validate tenant and release invariants
        run: npm run validate:release

      - name: Build
        run: npm run build

      - name: Validate bundled iOS assets
        run: npx cap copy ios

      - name: Validate iOS privacy manifest
        run: |
          test -f ios/App/App/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyTracking" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyCollectedDataTypeEmailAddress" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyCollectedDataTypePhotosorVideos" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "NSPrivacyCollectedDataTypeAudioData" ios/App/App/PrivacyInfo.xcprivacy
          grep -q "PrivacyInfo.xcprivacy in Resources" ios/App/App.xcodeproj/project.pbxproj

  deploy:
    name: Deploy Urban Director Studio to Cloudflare
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply and verify D1 migrations through Worker binding
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            response="$(curl --silent --show-error https://scenepilot.ryanedavis.workers.dev/health || true)"

            if [ -n "$response" ]; then
              echo "$response"

              if HEALTH_JSON="$response" node -e '
                const data = JSON.parse(process.env.HEALTH_JSON || "{}");
                if (!data.databaseBound || !data.databaseReady) process.exit(1);
                if (Number(data.migrationCount || 0) < 9) process.exit(1);
              '; then
                echo "Urban Director Studio D1 migrations: PASS"
                exit 0
              fi
            fi

            echo "Waiting for the deployed Worker/D1 schema to become ready (attempt $attempt/5)..."
            sleep 2
          done

          echo "::error::Urban Director Studio D1 migrations did not reach the expected release schema."
          exit 1

  migrate-public-windows-installer:
    name: Move Windows installer into private R2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Migrate, validate SHA256, then remove public installer
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NAME=Urban-Director-Studio-Windows-x64.exe
          OBJECT=ica-director-private-installers/private/windows/Urban-Director-Studio-Windows-x64.exe
          if ! gh release view windows-v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$NAME"; then
            echo 'Public installer already retired.'
            exit 0
          fi
          mkdir -p /tmp/uds-installer
          gh release download windows-v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir /tmp/uds-installer
          test "$(stat -c %s "/tmp/uds-installer/$NAME")" -gt 1000000
          npx --yes wrangler@4.160.1 r2 object put "$OBJECT" --file="/tmp/uds-installer/$NAME" --remote --content-type application/octet-stream
          npx --yes wrangler@4.160.1 r2 object get "$OBJECT" --file="/tmp/uds-installer/verified.exe" --remote
          test "$(sha256sum "/tmp/uds-installer/$NAME" | cut -d' ' -f1)" = "$(sha256sum /tmp/uds-installer/verified.exe | cut -d' ' -f1)"
          gh release delete-asset windows-v1.0.0 "$NAME" --repo "$GITHUB_REPOSITORY" --yes
          echo 'Private installer verified. Public installer removed.'
